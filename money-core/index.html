<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Core — Personal Finance Console</title><meta name="description" content="Track your balance, tuition, car expenses and budgets in your personal finance console."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head><body><aside><a class="brand" href="#dashboard"><span class="mark">M</span> MONEY CORE<small>PERSONAL FINANCE CONSOLE</small></a><div class="rail-label">CONTROL MODULES</div><nav id="nav"></nav><div class="rail-bottom"><span class="led"></span> FINANCIAL CORE ONLINE<br><small>USD · LOCAL STORAGE</small></div></aside><main><header><div><div class="eyebrow">KHATRI / FINANCIAL COMMAND</div><h1 id="title">Overview</h1></div><div class="header-controls"><span id="today"></span><button class="primary" id="add">＋ Add transaction</button></div></header><div id="content"></div><footer><span>MC–01 / PERSONAL FINANCE</span><span>Your data stays in this browser. Export a backup in Settings.</span></footer></main><dialog id="modal"><form id="form"><div class="dialog-head"><h2 id="modal-title">Add transaction</h2><button type="button" id="close" aria-label="Close">✕</button></div><input type="hidden" name="id"><label>Transaction name<input name="name" required maxlength="100" placeholder="e.g. October tuition"></label><div class="form-grid"><label>Amount ($)<input name="amount" type="number" min="0.01" max="999999999" step="0.01" required></label><label>Type<select name="type"><option value="expense">Expense</option><option value="income">Income</option></select></label><label>Category<select name="category"></select></label><label>Date<input name="date" type="date" required></label></div><label>Detail / subcategory<input name="detail" list="details" placeholder="e.g. Insurance, books, gas"><datalist id="details"><option>Car payment</option><option>Insurance</option><option>Gas</option><option>Maintenance</option><option>Repair</option><option>Registration</option><option>Parking</option><option>Tuition payment</option><option>Application fee</option><option>Books</option><option>College fees</option><option>Course materials</option></datalist></label><label>Note<textarea name="note" rows="2" maxlength="500"></textarea></label><button class="primary wide" type="submit">Save transaction</button></form></dialog><div id="toast" role="status"></div><script src="script.js"></script></body></html>
